<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تعلم الفرنسية - منصة تفاعلية للناطقين بالعربية</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cairo for Arabic & Plus Jakarta Sans for French -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .fr-font { font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
  </style>
</head>
<body class="bg-[#080d1a] text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white pb-24">
  <div class="max-w-md mx-auto min-h-screen px-4 pt-4 flex flex-col justify-between">
    <!-- Main Content Container -->
    <div id="app-view"></div>

    <!-- Fixed Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0d1428]/95 backdrop-blur-lg border-t border-slate-800/80 px-2 py-1 max-w-md mx-auto shadow-2xl">
      <div class="grid grid-cols-4 items-center h-16" id="nav-tabs">
        <button onclick="setTab('home')" id="tab-btn-home" class="flex flex-col items-center justify-center h-full min-h-[44px] transition-all text-indigo-400 font-bold">
          <span class="text-lg">🏠</span>
          <span class="text-[11px] mt-0.5">الرئيسية</span>
        </button>
        <button onclick="setTab('library')" id="tab-btn-library" class="flex flex-col items-center justify-center h-full min-h-[44px] transition-all text-slate-400">
          <span class="text-lg">📖</span>
          <span class="text-[11px] mt-0.5">المكتبة</span>
        </button>
        <button onclick="setTab('custom')" id="tab-btn-custom" class="flex flex-col items-center justify-center h-full min-h-[44px] transition-all text-slate-400">
          <span class="text-lg">💖</span>
          <span class="text-[11px] mt-0.5">جملي الخاصة</span>
        </button>
        <button onclick="setTab('settings')" id="tab-btn-settings" class="flex flex-col items-center justify-center h-full min-h-[44px] transition-all text-slate-400">
          <span class="text-lg">⚙️</span>
          <span class="text-[11px] mt-0.5">الإعدادات</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Inline Script Handling Entire Application Logic -->
  <script>
    // State Store with LocalStorage Persistence
    const STORAGE_KEY = 'standalone_french_sentences';
    const API_KEY_STORAGE = 'standalone_gemini_api_key';

    const INITIAL_SENTENCES = [
      {

      },
      {

        arabic: "كيف حالكم اليوم؟",

        words: [

          { french: "allez", arabic: "تذهبون / حالكم", pos: "فعل (Verbe)", gender: "-", number: "جمع" },
          { french: "vous", arabic: "أنتم / حضرتك", pos: "ضمير (Pronom)", gender: "-", number: "احترام" },
          { french: "aujourd'hui", arabic: "اليوم", pos: "ظرف زمان (Adverbe)", gender: "-", number: "-" }
        ]
      },
      {
        id: 'daily-3',
        french: "Je voudrais un café noir, s'il vous plaît.",
        arabic: "أود فنجان قهوة سوداء، من فضلك.",
        category: 'الحياة اليومية',
        register: 'مهذب',
        tone: 'مهذب ولطيف',
        cultural_note: "استخدام (Je voudrais) يعتبر قمة اللباقة في الطلب اليومي بالمقاهي الفرنسية.",
        words: [
          { french: "Je", arabic: "أنا", pos: "ضمير (Pronom)", gender: "-", number: "مفرد" },
          { french: "voudrais", arabic: "أودّ", pos: "فعل شرط (Conditionnel)", gender: "-", number: "مفرد" },
          { french: "un", arabic: "أداة تنكير", pos: "أداة (Article)", gender: "مذكر", number: "مفرد" },
          { french: "café", arabic: "قهوة", pos: "اسم (Nom)", gender: "مذكر", number: "مفرد" },
          { french: "noir", arabic: "سوداء", pos: "صفة (Adjectif)", gender: "مذكر", number: "مفرد" },
          { french: "s'il vous plaît", arabic: "من فضلكم", pos: "تعبير مجاملة (Locution)", gender: "-", number: "-" }
        ]
      },
      {
        id: 'shop-1',
        french: "Combien coûte cette chemise blanche ?",
        arabic: "كم سعر هذا القميص الأبيض؟",
        category: 'التسوق',
        register: 'مهذب',
        cultural_note: "تتبع الصفة الاسم في التذكير والتأنيث؛ chemise مؤنثة فتأخذ blanche.",
        words: [
          { french: "Combien", arabic: "كم", pos: "استفهام (Adverbe)", gender: "-", number: "-" },
          { french: "coûte", arabic: "يكلّف", pos: "فعل (Verbe)", gender: "-", number: "مفرد" },
          { french: "cette", arabic: "هذه", pos: "إشارة (Démonstratif)", gender: "مؤنث", number: "مفرد" },
          { french: "chemise", arabic: "قميص", pos: "اسم (Nom)", gender: "مؤنث", number: "مفرد" },
          { french: "blanche", arabic: "بيضاء", pos: "صفة (Adjectif)", gender: "مؤنث", number: "مفرد" }
        ]
      },
      {
        id: 'travel-1',
        french: "Où est la gare ferroviaire la plus proche ?",
        arabic: "أين أقرب محطة قطار؟",
        category: 'السفر',
        register: 'مهذب',
        cultural_note: "كلمة (gare) تخص محطات القطار، بينما (station) لمحطات المترو.",
        words: [
          { french: "Où", arabic: "أين", pos: "استفهام (Adverbe)", gender: "-", number: "-" },
          { french: "est", arabic: "تقع / تكون", pos: "فعل (Verbe)", gender: "-", number: "مفرد" },
          { french: "la", arabic: "الـ", pos: "أداة (Article)", gender: "مؤنث", number: "مفرد" },
          { french: "gare", arabic: "محطة", pos: "اسم (Nom)", gender: "مؤنث", number: "مفرد" },
          { french: "ferroviaire", arabic: "قطارات", pos: "صفة (Adjectif)", gender: "مؤنث", number: "مفرد" },
          { french: "la plus proche", arabic: "الأقرب", pos: "تفضيل (Superlatif)", gender: "مؤنث", number: "مفرد" }
        ]
      },
      {
        id: 'work-1',
        french: "Enchanté de faire votre connaissance pour cet entretien.",
        arabic: "تشرفت بمعرفتكم لهذه المقابلة الشخصية.",
        category: 'العمل',
        register: 'رسمي',
        cultural_note: "عبارة رسمية تبدأ بها المقابلات المهنية الفرنسية لإظهار اللباقة والاحترافية.",
        words: [
          { french: "Enchanté", arabic: "تشرفت", pos: "صفة (Adjectif)", gender: "مذكر", number: "مفرد" },
          { french: "de faire", arabic: "بصنع / بلقاء", pos: "مصدر (Infinitif)", gender: "-", number: "-" },
          { french: "votre", arabic: "حضرتكم", pos: "ملكية (Possessif)", gender: "-", number: "مفرد" },
          { french: "connaissance", arabic: "معرفة", pos: "اسم (Nom)", gender: "مؤنث", number: "مفرد" },
          { french: "entretien", arabic: "مقابلة", pos: "اسم (Nom)", gender: "مذكر", number: "مفرد" }
        ]
      },
      {
        id: 'intro-1',
        french: "Comment vous appelez-vous ?",
        arabic: "ما هو اسم حضرتك؟",
        category: 'التعارف',
        register: 'رسمي',
        cultural_note: "صيغة السؤال الراقية عند التعارف مع شخص لأول مرة أو شخص أكبر سناً.",
        words: [
          { french: "Comment", arabic: "ما / كيف", pos: "استفهام (Adverbe)", gender: "-", number: "-" },
          { french: "vous", arabic: "حضرتكم", pos: "ضمير (Pronom)", gender: "-", number: "جمع" },
          { french: "appelez", arabic: "تُسمون", pos: "فعل (Verbe)", gender: "-", number: "جمع" },
          { french: "vous", arabic: "أنتم", pos: "فاعل (Sujet)", gender: "-", number: "جمع" }
        ]
      }
    ];

    let currentTab = 'home';
    let currentSentence = null;
    let isSlow = false;
    let selectedWord = null;

    function getCustomSentences() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveCustomSentences(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function getAllSentences() {
      return [...getCustomSentences(), ...INITIAL_SENTENCES];
    }

    // Audio Speech Synthesis
    function speak(text, slow = false) {
      if (!('speechSynthesis' in window)) {
        alert('المتصفح لا يدعم نطق الصوت');
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR';
      u.rate = slow ? 0.65 : 0.95;
      window.speechSynthesis.speak(u);
    }

    function setTab(tab) {
      currentTab = tab;
      currentSentence = null;
      selectedWord = null;
      updateNav();
      render();
    }

    function updateNav() {
      ['home', 'library', 'custom', 'settings'].forEach(t => {
        const btn = document.getElementById('tab-btn-' + t);
        if (btn) {
          if (t === currentTab) {
            btn.className = "flex flex-col items-center justify-center h-full min-h-[44px] transition-all text-indigo-400 font-bold scale-105";
          } else {
            btn.className = "flex flex-col items-center justify-center h-full min-h-[44px] transition-all text-slate-400 hover:text-slate-200";
          }
        }
      });
    }

    function openSentence(sentenceId) {
      const all = getAllSentences();
      currentSentence = all.find(s => s.id === sentenceId) || null;
      selectedWord = null;
      render();
    }

    function selectWord(idx) {
      if (!currentSentence || !currentSentence.words[idx]) return;
      selectedWord = currentSentence.words[idx];
      speak(selectedWord.french, isSlow);
      render();
    }

    function render() {
      const view = document.getElementById('app-view');
      if (currentSentence) {
        renderSentenceDetail(view);
        return;
      }

      switch (currentTab) {
        case 'home':
          renderHome(view);
          break;
        case 'library':
          renderLibrary(view);
          break;
        case 'custom':
          renderCustom(view);
          break;
        case 'settings':
          renderSettings(view);
          break;
      }
    }

    function renderHome(container) {
      container.innerHTML = `
        <div class="space-y-4 pb-8 animate-fadeIn">
          <div class="relative rounded-3xl overflow-hidden p-6 bg-gradient-to-br from-indigo-950 via-[#0e1633] to-[#080d1a] border border-indigo-500/30 shadow-2xl text-right">
            <div class="inline-flex items-center gap-2 px-3 py-1 bg-white/10 rounded-full text-xs font-bold text-white mb-3">
              <span>🇫🇷</span>
              <span>تعلم الفرنسية التفاعلي</span>
            </div>
            <h1 class="text-3xl font-black text-white">خطوة بخطوة نحو التحدث بطلاقة</h1>
            <p class="text-xs text-indigo-200 mt-2">منصة تفاعلية مخصصة للناطقين بالعربية مع تجزئة الكلمات والنطق الصوتي.</p>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center">
            <button onclick="setTab('library')" class="p-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-md">
              <div class="text-xl mb-1">📖</div>
              <span>المكتبة التعليمية</span>
            </button>
            <button onclick="setTab('custom')" class="p-3.5 rounded-2xl bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs shadow-md">
              <div class="text-xl mb-1">💖</div>
              <span>جملي الخاصة</span>
            </button>
            <button onclick="setTab('settings')" class="p-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md">
              <div class="text-xl mb-1">⚙️</div>
              <span>الإعدادات</span>
            </button>
          </div>

          <div class="bg-[#101733] border border-slate-800 rounded-2xl p-4 text-right space-y-2">
            <div class="font-bold text-sm text-slate-200">« La langue est la clé d’un nouveau monde. »</div>
            <div class="text-xs text-indigo-300">اللغة هي مفتاح عالم جديد.</div>
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between text-xs text-slate-400 font-bold px-1">
              <span>نماذج مختارة للبدء:</span>
              <button onclick="setTab('library')" class="text-indigo-400 hover:underline">عرض الكل</button>
            </div>
            ${INITIAL_SENTENCES.slice(0, 3).map(s => `
              <div onclick="openSentence('${s.id}')" class="p-4 rounded-2xl bg-[#111933] border border-slate-800 hover:border-indigo-500/50 cursor-pointer space-y-2 transition-all">
                <div class="flex items-center justify-between text-xs">
                  <span class="px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 font-semibold">${s.category}</span>
                  <button onclick="event.stopPropagation(); speak('${s.french.replace(/'/g, "\\'")}', false)" class="p-1.5 rounded-lg bg-indigo-600 text-white text-xs">🔊 استمع</button>
                </div>
                <div dir="ltr" class="fr-font text-base font-bold text-white text-left">${s.french}</div>
                <div class="text-xs text-slate-300 text-right">${s.arabic}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderSentenceDetail(container) {
      const s = currentSentence;
      container.innerHTML = `
        <div class="space-y-4 pb-8 animate-fadeIn text-right">
          <div class="flex items-center justify-between">
            <button onclick="currentSentence = null; render();" class="px-3 py-1.5 rounded-xl bg-slate-800 text-xs font-bold text-slate-200">
              ← رجوع
            </button>
            <span class="px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-bold">
              ${s.category} · ${s.register}
            </span>
          </div>

          <div class="bg-[#111936] border border-indigo-500/30 rounded-3xl p-5 shadow-2xl space-y-4">
            <div class="text-xs text-indigo-300 font-medium">اضغط على أي كلمة لعرض تفصيلها النحوي وترجمتها:</div>
            
            <div dir="ltr" class="flex flex-wrap gap-2 items-center fr-font text-xl font-bold py-2">
              ${s.words.map((w, idx) => `
                <button onclick="selectWord(${idx})" class="px-3 py-1.5 rounded-xl border transition-all ${
                  selectedWord && selectedWord.french === w.french
                    ? 'bg-indigo-600 text-white border-indigo-400 shadow-lg'
                    : 'bg-[#162044] hover:bg-[#1e2b5c] text-white border-indigo-900/60'
                }">
                  ${w.french}
                </button>
              `).join('')}
            </div>

            ${selectedWord ? `
              <div class="p-4 rounded-2xl bg-indigo-950/80 border border-indigo-400/40 text-xs space-y-2 animate-fadeIn text-right">
                <div class="flex items-center justify-between font-bold">
                  <span class="fr-font text-base text-indigo-300">${selectedWord.french}</span>
                  <button onclick="speak('${selectedWord.french.replace(/'/g, "\\'")}', true)" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs">🔊 نطق الكلمة</button>
                </div>
                <div class="text-white font-semibold">المعنى: ${selectedWord.arabic}</div>
                <div class="text-slate-300">الدور النحوي: ${selectedWord.pos} ${selectedWord.gender && selectedWord.gender !== '-' ? '· ' + selectedWord.gender : ''}</div>
              </div>
            ` : ''}

            <div class="p-4 rounded-2xl bg-[#0c1226] border border-slate-800 text-right">
              <div class="text-xs text-slate-400 mb-1">الترجمة الطبيعية:</div>
              <div class="text-lg font-bold text-white">${s.arabic}</div>
            </div>

            <div class="flex items-center gap-3 pt-1">
              <button onclick="speak('${s.french.replace(/'/g, "\\'")}', isSlow)" class="flex-1 py-3 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg flex items-center justify-center gap-2">
                <span>🔊</span>
                <span>النطق الكامل</span>
              </button>
              <button onclick="isSlow = !isSlow; render();" class="px-3 py-3 rounded-2xl border ${isSlow ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'} text-xs font-bold">
                بطيء: ${isSlow ? 'مفعل' : 'معطل'}
              </button>
            </div>
          </div>

          ${s.cultural_note ? `
            <div class="p-4 bg-amber-500/10 border border-amber-500/20 rounded-2xl text-xs text-amber-200 leading-relaxed text-right space-y-1">
              <div class="font-bold text-amber-400">💡 ملاحظة ثقافية ونحوية:</div>
              <div>${s.cultural_note}</div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderLibrary(container) {
      const all = getAllSentences();
      container.innerHTML = `
        <div class="space-y-4 pb-8 animate-fadeIn text-right">
          <h2 class="text-xl font-black text-white">المكتبة التعليمية</h2>
          <div class="space-y-3">
            ${all.map(s => `
              <div onclick="openSentence('${s.id}')" class="p-4 rounded-2xl bg-[#111933] border border-slate-800 hover:border-indigo-500/50 cursor-pointer space-y-2 transition-all">
                <div class="flex items-center justify-between text-xs">
                  <span class="px-2.5 py-0.5 rounded-lg bg-indigo-950 text-indigo-300 font-bold">${s.category}</span>
                  <button onclick="event.stopPropagation(); speak('${s.french.replace(/'/g, "\\'")}', false)" class="p-1.5 rounded-lg bg-indigo-600 text-white text-xs">🔊</button>
                </div>
                <div dir="ltr" class="fr-font text-base font-bold text-white text-left">${s.french}</div>
                <div class="text-xs text-slate-300">${s.arabic}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCustom(container) {
      const custom = getCustomSentences();
      container.innerHTML = `
        <div class="space-y-4 pb-8 animate-fadeIn text-right">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-black text-white">جملي الخاصة</h2>
            <button onclick="addManualPrompt()" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">+ إضافة</button>
          </div>
          ${custom.length === 0 ? `
            <div class="p-8 text-center bg-[#101730] border border-slate-800 rounded-3xl space-y-2">
              <div class="text-2xl">✍️</div>
              <div class="text-sm font-bold text-slate-200">لا توجد جمل مخصصة بعد</div>
              <button onclick="addManualPrompt()" class="mt-2 px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">أضف جملتك الأولى</button>
            </div>
          ` : `
            <div class="space-y-3">
              ${custom.map(s => `
                <div onclick="openSentence('${s.id}')" class="p-4 rounded-2xl bg-[#111933] border border-slate-800 cursor-pointer space-y-2">
                  <div dir="ltr" class="fr-font text-base font-bold text-white text-left">${s.french}</div>
                  <div class="text-xs text-slate-300">${s.arabic}</div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function addManualPrompt() {
      const fr = prompt('أدخل الجملة بالفرنسية:');
      if (!fr) return;
      const ar = prompt('أدخل الترجمة بالعربية:');
      if (!ar) return;

      const words = fr.split(' ').map(w => ({
        french: w,
        arabic: w,
        pos: 'كلمة',
        gender: '-',
        number: '-'
      }));

      const newS = {
        id: 'cust-' + Date.now(),
        french: fr,
        arabic: ar,
        category: 'الحياة اليومية',
        register: 'ودي',
        cultural_note: 'جملة مضافة من قبل المستخدم.',
        words
      };

      const cur = getCustomSentences();
      saveCustomSentences([newS, ...cur]);
      render();
    }

    function renderSettings(container) {
      container.innerHTML = `
        <div class="space-y-4 pb-8 animate-fadeIn text-right">
          <h2 class="text-xl font-black text-white">الإعدادات</h2>
          <div class="bg-[#111933] border border-slate-800 rounded-2xl p-4 space-y-3">
            <h3 class="text-sm font-bold text-white">إعدادات النطق والتخزين</h3>
            <p class="text-xs text-slate-400">تطبيق تفاعلي مستقل بالكامل يعمل على جميع المتصفحات.</p>
            <button onclick="speak('Bonjour et bienvenue !', false)" class="w-full py-2.5 px-3 rounded-xl bg-slate-800 text-indigo-300 font-bold text-xs">
              🔊 تجربة النطق الفرنسي
            </button>
          </div>
        </div>
      `;
    }

    // Start App
    render();
  </script>
</body>
